name: Build Android APK (Mira Sweetheart)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  APP_URL: "https://mira-your-ai-sweetheart.lovable.app"
  APP_NAME: "Mira Sweetheart"
  APP_ID: "com.mira.sweetheart"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Create Clean Native Android Shell
        run: |
          rm -rf shell
          mkdir -p shell/www shell/assets
          
          # Clean loading page (No external redirect scripts, no CRUD sample!)
          cat << 'EOF' > shell/www/index.html
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <style>
              body { background: #2a1226; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
            </style>
          </head>
          <body>
            <div>Loading Mira... ❤️</div>
          </body>
          </html>
          EOF

          cd shell
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets

          # Capacitor config with live URL and full internal navigation lock
          cat << EOF > capacitor.config.json
          {
            "appId": "$APP_ID",
            "appName": "$APP_NAME",
            "webDir": "www",
            "server": {
              "url": "$APP_URL",
              "cleartext": false,
              "androidScheme": "https",
              "allowNavigation": [
                "mira-your-ai-sweetheart.lovable.app",
                "*.lovable.app",
                "*.lovable.dev",
                "*.supabase.co",
                "*"
              ]
            }
          }
          EOF

          npx cap add android

      - name: Generate App Icon from Mira's photo
        run: |
          if [ -f src/assets/mira.jpg ]; then
            which convert || sudo apt-get install -y imagemagick
            convert src/assets/mira.jpg -resize 1024x1024! shell/assets/icon-only.png
            cd shell
            npx @capacitor/assets generate --android --iconBackgroundColor '#2a1226'
          else
            echo "No src/assets/mira.jpg found, keeping the default icon."
          fi

      - name: Add Permissions & Sync
        run: |
          cd shell
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application android:usesCleartextTraffic="true"#' $MANIFEST
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd shell/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mira-Sweetheart-App
          path: shell/android/app/build/outputs/apk/debug/app-debug.apk
          
