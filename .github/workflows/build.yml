name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Install
        run: npm install --legacy-peer-deps

      - name: Build web (SPA)
        run: |
          npm run build
          rm -rf dist
          mkdir dist
          if [ -d ".output/public" ]; then cp -r .output/public/. dist/; fi
          if [ ! -f dist/index.html ] && [ -f dist/_shell.html ]; then cp dist/_shell.html dist/index.html; fi
          ls -la dist
          test -f dist/index.html

      - name: Capacitor Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/app @capacitor/local-notifications --legacy-peer-deps
          rm -f capacitor.config.ts capacitor.config.json
          printf '{"appId":"com.jyoti.mira","appName":"Mira","webDir":"dist","server":{"url":"https://mira-my-sweet-chat.lovable.app","cleartext":false}}' > capacitor.config.json
          rm -rf android
          npx cap add android

      - name: Android permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <application#' $MANIFEST
          grep -n "uses-permission" $MANIFEST

      - name: Sync plugins
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Mira-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
