name: Build Android APK (Mira Sweetheart)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  APP_NAME: "Mira Sweetheart"
  APP_ID: "com.mira.sweetheart"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Install dependencies & Build React App
        run: |
          npm install --legacy-peer-deps || npm install
          npm run build

      - name: Setup Capacitor Android inside Repo
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets --save-dev --legacy-peer-deps
          printf '{"appId":"%s","appName":"%s","webDir":"dist","server":{"androidScheme":"https"}}' "$APP_ID" "$APP_NAME" > capacitor.config.json
          npx cap add android

      - name: Generate App Icon from Mira's photo
        run: |
          if [ -f src/assets/mira.jpg ]; then
            mkdir -p assets
            which convert || sudo apt-get install -y imagemagick
            convert src/assets/mira.jpg -resize 1024x1024! assets/icon-only.png
            npx @capacitor/assets generate --android --iconBackgroundColor '#2a1226'
          else
            echo "No src/assets/mira.jpg found, keeping the default icon."
          fi

      - name: Add Android Permissions (Internet & Mic)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application android:usesCleartextTraffic="true"#' $MANIFEST
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mira-Sweetheart-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
